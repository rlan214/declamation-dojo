<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dojo">
<title>Declamation Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff6fae;--pink2:#ff9cc9;--lav:#a78bfa;--lav2:#c4b5fd;--mint:#34d399;--ink:#3b2a5c;--muted:#8a7aa8;--paper:rgba(255,255,255,.88);--line:#f3dcff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"M PLUS Rounded 1c",ui-rounded,-apple-system,system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:500;background:linear-gradient(165deg,#ffe3f1 0%,#efe6ff 45%,#dcf2ff 100%) fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.9) 0 2px,transparent 3px),radial-gradient(circle at 78% 9%,rgba(255,255,255,.9) 0 2px,transparent 3px),radial-gradient(circle at 88% 62%,rgba(255,255,255,.8) 0 2px,transparent 3px),radial-gradient(circle at 30% 80%,rgba(255,255,255,.8) 0 2px,transparent 3px),radial-gradient(circle at 55% 40%,rgba(255,255,255,.7) 0 1.5px,transparent 2.5px)}
header{position:sticky;top:0;z-index:6;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--pink),var(--lav));color:#fff;box-shadow:0 4px 18px rgba(167,139,250,.35)}
header h1{font-size:22px;margin:0;flex:1;font-weight:800;letter-spacing:.5px}
header button{background:rgba(255,255,255,.25);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;font-weight:700}
main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:16px 16px 70px}
h2{margin:.2em 0 .4em;font-weight:800}
.card{background:var(--paper);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid #fff;border-radius:26px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(167,139,250,.22)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:800;color:#fff;margin:8px 8px 0 0;min-height:52px;cursor:pointer;background:linear-gradient(135deg,var(--lav),#818cf8);box-shadow:0 4px 0 rgba(91,63,170,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(91,63,170,.25)}
.btn.red{background:linear-gradient(135deg,var(--pink),#ff8a8a);box-shadow:0 4px 0 rgba(200,60,120,.28)}
.btn.green{background:linear-gradient(135deg,var(--mint),#2dd4bf);box-shadow:0 4px 0 rgba(20,140,110,.28)}
.btn.gold{background:linear-gradient(135deg,#fde68a,#fbbf24);color:var(--ink);box-shadow:0 4px 0 rgba(200,140,20,.28)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sparkle{background:linear-gradient(135deg,#fff,#fdf2ff);color:var(--pink);border:2px dashed var(--pink2);box-shadow:none}
.btn.mini{min-height:40px;padding:8px 14px;font-size:14px;margin:4px 4px 0 0}
.btn:disabled{opacity:.4}
.muted{color:var(--muted);font-size:15px}.small{font-size:13px}
.center{text-align:center}
.hero{text-align:center;background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(255,240,250,.94))}
.hero .big{font-size:28px;font-weight:800;background:linear-gradient(90deg,var(--pink),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent}
.count{font-size:22px;font-weight:800;color:var(--pink);margin-top:6px}
.mascot{font-size:52px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.tagline{font-weight:800;color:var(--lav);font-size:14px;letter-spacing:.5px}
.tag{display:inline-block;background:#fff0f7;color:var(--pink);border:1.5px solid var(--pink2);border-radius:999px;font-size:12px;padding:1px 8px;margin-left:6px;font-weight:800;vertical-align:middle}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-left:8px solid;border-radius:16px;background:#fff;padding:10px 12px;margin-top:10px}
.trow.now{box-shadow:0 0 0 3px var(--pink2)}
.trow.locked{opacity:.8}
.line{font-size:28px;font-weight:800;margin:16px 0}
.line.sm{font-size:21px;font-weight:700;margin:6px 0}
.line.ans{color:var(--pink)}
.line.hidden{color:#d9c8f0;letter-spacing:8px}
.flash{padding:28px 18px}
.cue{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;margin:14px 0 8px;font-size:16px;text-align:left;box-shadow:4px 4px 0 var(--lav2)}
.cue:before{content:"Coach says ✦";position:absolute;top:-12px;left:14px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;padding:2px 10px;border-radius:999px;letter-spacing:.5px}
.vol{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:800;font-size:12px;margin-right:8px;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.v1{background:#b6a8e6}.v2{background:#7dd3fc}.v3{background:#34d399}.v4{background:#fb923c}.v5{background:#ff4d8d}
.stars{text-align:center;font-size:20px;letter-spacing:3px;margin:6px 0}
.num{display:inline-flex;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;font-size:14px;font-weight:800;align-items:center;justify-content:center;margin-right:8px;flex:none}
.stz{display:flex;gap:4px;margin:14px 0;font-size:22px;font-weight:700}
.blank{color:transparent;border-bottom:3px solid var(--pink);border-radius:2px;cursor:pointer;user-select:none}
.blank.peek{color:var(--pink)}
.meter{height:12px;background:#f3e8ff;border-radius:999px;overflow:hidden;margin:8px 0}
.meter div{height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));transition:width .3s}
.stzc{display:flex;flex-wrap:wrap;align-items:flex-start}
.stzc .line{flex:1;min-width:200px}
.stzc .cue{flex-basis:100%}
.pausebar{background:linear-gradient(90deg,var(--ink),#5b3fa0);color:#fff;border-radius:18px;padding:12px 16px;margin:0 0 16px;font-weight:800}
.intro{background:linear-gradient(135deg,#ecfdf5,#f0f9ff)}
.warnc{background:#fff7ed}
.ladder .rung{background:linear-gradient(90deg,#fff0f7,#f3e8ff);border-radius:16px;padding:10px 14px;margin:6px 0;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{border:2.5px solid var(--lav);background:#fff;color:var(--ink);border-radius:999px;padding:12px 18px;font:inherit;font-weight:800;min-height:52px}
.shake{animation:sh .35s;border-color:var(--pink);color:var(--pink)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
textarea{width:100%;min-height:200px;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:18px;padding:12px;background:#fff;color:var(--ink)}
.fld{display:block;margin-top:12px;font-weight:700;font-size:15px}
.fld input,.fld select,select.full{display:block;width:100%;margin-top:6px;font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.fld.inl input{display:inline-block;width:84px;margin-left:6px}
.pv{border-bottom:1px dashed var(--line);padding:8px 0;display:flex;align-items:center;gap:6px;font-size:16px}
.ec{border-bottom:1px dashed var(--line);padding:10px 0}
.ec select,.ec input{font:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:6px}
.ec input{width:100%}
.ok{color:#0f9f73;font-weight:800}.warn{color:#c2410c;font-weight:800}
video{width:100%;border-radius:18px;margin-top:12px;background:#000}
.check label{display:flex;align-items:center;padding:7px 0;font-size:17px}
.check input,.parent input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink);margin-right:12px;flex:none}
.pin{font-size:30px!important;letter-spacing:14px;text-align:center}
.huge{font-size:70px}
.burst{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.toggle{float:right;font-size:14px;min-height:40px;padding:8px 12px;margin:0}
svg.vm{width:100%;height:70px;display:block;margin-top:10px}
.petal{position:fixed;top:-30px;z-index:0;pointer-events:none;width:14px;height:12px;background:#ffc1dc;border-radius:12px 0 12px 0;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.petal{display:none}.mascot{animation:none}}
</style>
</head>
<body>
<header><h1>✦ Declamation Dojo ✦</h1><button onclick="go('home')">Home</button><button onclick="go('admin')">🔒</button></header>
<main id="app"></main>
<script>
const KEY='declamation-dojo-v1';
const COLORS=['#fbbf24','#7dd3fc','#ff4d8d','#34d399','#a78bfa','#fb923c'];
const VOLNAME=['','whisper','soft','normal','loud','loudest'];
const LLAMA_RE=/llama\s+llama\s+red\s+paj/i;
const CHECK=['Said the intro clearly','Loud parts were really loud','Soft parts were soft but still clear','Paused at the big moments','Hands went back down after each gesture','Eyes up, not at the floor','Feet still, no swaying','Ending was slow and calm'];

// Built-in coach pack for Llama Llama Red Pajama (cues only, no poem text)
const LLAMA_PACK={
 sections:[
  {name:'Act 1',sub:'Cozy & calm',from:0,to:5,note:''},
  {name:'Act 2',sub:'Worry creeps in',from:6,to:11,note:'Getting worried. Slow down a little.'},
  {name:'Act 3',sub:'The meltdown (LOUD!)',from:12,to:17,note:'Meltdown time! Louder and faster each stanza.'},
  {name:'Act 4',sub:"Mama's voice",from:18,to:21,note:"⏸ BIG PAUSE + breath. Switching to Mama's voice."},
  {name:'Ending',sub:'Sleepy & soft',from:22,to:23,note:'🌙 Getting sleepy. Slow way down.'}],
 cues:[[3,'Relaxed, normal voice. Little smile.'],[2,'Gentle on the kiss. Calm.'],[2,'A bit sad on "alone."'],[2,'Small Llama voice. He wants something.'],[3,'Call out a little. Hand by mouth.'],[2,'Hum for 2 seconds only, then move on.'],
  [2,'Slow down. Stretch "waiting… waiting…"'],[2,'Worried face on "fret."'],[1,'Quiet, whiny Llama voice.'],[2,'Hand to ear on "phone." Little moan.'],[1,'Whisper "quiet" but say it clearly. Lean in like you\'re listening.'],[2,'Fists at eyes on "boo hoo-ing."'],
  [4,'LOUD now! Get faster from here.'],[4,'Small stomp, small jump. Keep it neat.'],[4,'Big, scared voice.'],[5,'Wide eyes, pull up covers. PAUSE one beat, then "GONE?!"'],[5,'Louder: weeping, wailing.'],[5,'"RUN, RUN, RUN" — each one louder. The biggest moment!'],
  [3,'Mama voice: warm, steady, a little lower. Playful on "tizzy."'],[3,'Hands on hips for "llama drama." Firm but kind.'],[2,'Slow and gentle. Hand on heart for "loves you so."'],[2,'Soft and comforting.'],
  [1,'Softest voice yet. Two tiny kiss motions.'],[1,'PAUSE before the last line. Whisper it. Head on hands, hold 2 seconds.']].map(([v,c])=>({v,c})),
 ladder:['reads','feels alone','calls down','waiting','whimpers','listens','hollers','in the dark','weeping, wailing','(Mama talks)','two kisses']};

let D={pieces:[],cur:null,pin:'',apiKey:'',model:'claude-sonnet-5-5'};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)D=Object.assign(D,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
let grownUp=false,FLASH='';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const app=$('#app');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br=t=>esc(t).replace(/\n/g,'<br>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rng=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const P=()=>D.pieces.find(p=>p.id===D.cur)||null;

// dates (local, YYYY-MM-DD)
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayS=()=>iso(new Date());
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});

// ---------- schedule ----------
const validEnds=(e,n)=>e.length>0&&e.every((x,i)=>Number.isInteger(x)&&x>=(i?e[i-1]+1:0)&&x<n)&&e[e.length-1]===n-1;
function plan(p){
 const n=p.stanzas.length,total=Math.max(1,diff(p.start,p.date));
 let polish=total<=2?0:total<=5?1:Math.max(2,Math.round(total*.2));
 let L=total-polish;if(L<1){L=1;polish=Math.max(0,total-1)}
 const weekly=L>=14;
 const units=Math.max(1,Math.min(weekly?Math.floor(L/7):L,n));
 const ul=L/units;
 let ends=p.chunkEnds;
 if(!Array.isArray(ends)||ends.length!==units||!validEnds(ends,n))ends=Array.from({length:units},(_,i)=>Math.round(n*(i+1)/units)-1);
 let s=0;
 const chunks=ends.map((e,i)=>{const c={i,from:s,to:e,start:addD(p.start,Math.round(i*ul)),end:addD(p.start,Math.max(Math.round(i*ul),Math.round((i+1)*ul)-1))};s=e+1;return c});
 return {chunks,weekly,unit:weekly?'Week':'Day',polishStart:addD(p.start,L),polish};
}
function nowIdx(p,pl){const t=todayS();if(t>=pl.polishStart)return 'polish';let k=0;pl.chunks.forEach(c=>{if(t>=c.start)k=c.i});return k}
const mastered=(p,i)=>(p.score[i]||0)>=2;
const chunkDone=(p,c)=>rng(c.from,c.to).every(i=>mastered(p,i));
function chunkOpen(p,pl,k){const n=nowIdx(p,pl);return n==='polish'||k<=n||k<=(p.unlockedTo||0)||(k>0&&chunkDone(p,pl.chunks[k-1]))}
function sel(s){
 const p=P(),pl=plan(p);
 if(s==='all')return p.stanzas.map((_,i)=>i);
 if(s==='rev'){const n=nowIdx(p,pl),to=n==='polish'?p.stanzas.length:pl.chunks[n].from;return rng(0,to-1)}
 const c=pl.chunks[+s.slice(1)]||pl.chunks[0];return rng(c.from,c.to);
}
function selLabel(s){const pl=plan(P());if(s==='all')return 'Whole piece';if(s==='rev')return 'Review';return pl.unit+' '+(+s.slice(1)+1)}

// ---------- piece helpers ----------
const cueOf=(p,i)=>p.pack&&p.pack.cues[i]?p.pack.cues[i]:null;
const secIdx=(p,i)=>p.pack?p.pack.sections.findIndex(s=>i>=s.from&&i<=s.to):-1;
const colorOf=(p,i)=>{const k=secIdx(p,i);return k<0?'#c4b5fd':COLORS[k%6]};
const cueBox=(p,i)=>{const c=cueOf(p,i);return c&&c.c?`<div class="cue"><span class="vol v${c.v}">${VOLNAME[c.v]}</span>${esc(c.c)}</div>`:''};
const stars=(p,idx)=>`<div class="stars">${idx.map(i=>(p.score[i]||0)>=2?'🌟':((p.score[i]||0)>=1?'⭐':'☆')).join(' ')}</div>`;
const introText=p=>`Good morning, judges, teachers, and fellow students. My piece is "${p.title}"${p.author?' by '+p.author:''}.`;

function parse(text,mode){
 const rows=text.split(/\r?\n/).map(l=>l.trim().replace(/\bWimpers\b/g,'Whimpers')).filter(l=>!/^[.…•·]+$/.test(l));
 const blocks=[];let cur=[];
 rows.forEach(l=>{if(!l){if(cur.length)blocks.push(cur);cur=[]}else cur.push(l)});if(cur.length)blocks.push(cur);
 const flat=blocks.flat();
 const by=k=>{const o=[];for(let i=0;i<flat.length;i+=k)o.push(flat.slice(i,i+k));return o};
 if(mode==='2')return by(2);if(mode==='4')return by(4);if(mode==='blank')return blocks;
 return blocks.length>1&&blocks.every(b=>b.length<=8)?blocks:by(2);
}
function volMap(p,idx){
 const n=idx.length,w=10;
 const bars=idx.map((i,j)=>{const c=cueOf(p,i),v=c?c.v:3,h=v*11;return `<rect x="${j*w+1}" y="${60-h}" width="${w-2}" height="${h}" rx="3" fill="${colorOf(p,i)}"/>`}).join('');
 return `<svg class="vm" viewBox="0 0 ${n*w} 60" preserveAspectRatio="none">${bars}</svg><div class="muted small" style="display:flex;justify-content:space-between"><span>Volume map: tall = loud, short = soft</span><span>stanza ${idx[0]+1} → ${idx[n-1]+1}</span></div>`;
}

// ---------- coach pack (AI) ----------
function buildPrompt(p){
 const n=p.stanzas.length;
 return `You are a declamation coach for an elementary-school student (about 9 years old). Below is the piece "${p.title}"${p.author?' by '+p.author:''}, split into ${n} numbered stanzas.

Return ONLY a JSON object, no other text, in this shape:
{"sections":[{"name":"Act 1","sub":"short mood label","from":1,"to":6,"note":"short tip shown before this section starts, or empty"}],
 "cues":[{"s":1,"v":3,"c":"short coaching tip"}],
 "ladder":["short phrase","..."]}

Rules:
- sections: 3 to 6 parts that follow the emotional arc, in order, covering every stanza from 1 to ${n} with no gaps or overlaps.
- cues: exactly one per stanza; s = stanza number. v = volume: 1 whisper, 2 soft, 3 normal, 4 loud, 5 loudest. Build real contrast: quiet parts, one clear loudest peak, and a calm ending.
- c: at most 15 simple words a child understands. Cover voice, speed, pauses, and at most one small gesture. Point out the biggest moment and where to pause.
- ladder: 6 to 12 short phrases, in story order, naming the key beats so she can remember what comes next.

Stanzas:
${p.stanzas.map((s,i)=>(i+1)+'. '+s.join(' / ')).join('\n')}`;
}
function applyPackText(txt){
 const p=P(),n=p.stanzas.length,a=txt.indexOf('{'),b=txt.lastIndexOf('}');
 if(a<0||b<a)throw new Error('No coach pack found in that text.');
 const j=JSON.parse(txt.slice(a,b+1));
 const cues=Array.from({length:n},()=>({v:3,c:''}));
 (j.cues||[]).forEach((c,k)=>{const i=(parseInt(c.s)||k+1)-1;if(i>=0&&i<n)cues[i]={v:Math.min(5,Math.max(1,Math.round(+c.v)||3)),c:String(c.c||'').trim()}});
 const sections=(j.sections||[]).map(s=>({name:String(s.name||''),sub:String(s.sub||''),from:Math.max(0,(parseInt(s.from)||1)-1),to:Math.min(n-1,(parseInt(s.to)||n)-1),note:String(s.note||'')})).filter(s=>s.from<=s.to).sort((x,y)=>x.from-y.from);
 const ladder=(j.ladder||[]).map(x=>String(x).trim()).filter(Boolean).slice(0,14);
 if(!cues.some(c=>c.c))throw new Error('The coach pack had no cues.');
 p.pack={sections,cues,ladder};save();
}
async function askClaude(){
 const p=P();
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':D.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:D.model||'claude-sonnet-5-5',max_tokens:4000,messages:[{role:'user',content:buildPrompt(p)}]})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
 applyPackText((j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''));
}

// ---------- views ----------
const ADMIN=['admin','setup','editcues','pastepack'];
const back=(to='home')=>`<button class="btn ghost" style="margin:0 0 14px" onclick="go('${to}')">← Back</button>`;
const V={
home(){
 const p=P();
 if(!p){app.innerHTML=`<div class="card hero"><div class="mascot">🥋</div><div class="big">Declamation Dojo</div><p>Train your piece one step at a time.</p><p class="muted">A grown-up adds the piece first.</p><button class="btn red" onclick="go('setup','new')">✦ Add a piece</button></div>`;return}
 const pl=plan(p),n=nowIdx(p,pl),left=diff(todayS(),p.date),tot=p.stanzas.length,got=p.stanzas.filter((_,i)=>mastered(p,i)).length;
 let h='';
 if(D.pieces.length>1)h+=`<div class="card"><select class="full" onchange="D.cur=this.value;save();go('home')">${D.pieces.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>`;
 h+=`<div class="card hero"><div class="mascot">🥋</div><div class="big">${esc(p.title)}</div><div class="muted">${p.author?'by '+esc(p.author)+' · ':''}${fmt(p.date)}</div><div class="count">${left>1?left+' days to go':left===1?'Tomorrow! ✦':left===0?"Today's the day! ✦":'Performed! 🎉'}</div><div class="muted">${got}/${tot} 🌟 mastered</div></div>`;
 if(!p.pack)h+=`<div class="card warnc">No coach marks yet. A grown-up can add them under 🔒.</div>`;
 if(n==='polish'){
  h+=`<div class="card"><div class="tagline">✦ POLISH TIME</div><h2>Full runs every day</h2><p class="muted">Do the whole piece with the intro and the bow. Record it, then watch it together.</p><button class="btn red" onclick="go('read','all')">📜 Full run with cues</button><button class="btn green" onclick="go('record')">🎥 Record myself</button><button class="btn" onclick="go('cards','all')">Flash cards: all</button><button class="btn ghost" onclick="go('fade','all')">Fade-out: all</button></div>`;
 }else{
  const c=pl.chunks[n];
  h+=`<div class="card" style="border-top:12px solid ${COLORS[n%6]}"><div class="tagline">✦ ${pl.unit.toUpperCase()} ${n+1} OF ${pl.chunks.length} · ${fmt(c.start)}–${fmt(c.end)}</div><h2>Stanzas ${c.from+1}–${c.to+1}</h2>${stars(p,rng(c.from,c.to))}<p class="muted">Each day: about 10 minutes on these, then 5 minutes of review.</p><button class="btn red" onclick="go('cards','c${n}')">Flash cards</button><button class="btn" onclick="go('fade','c${n}')">Fade-out</button><button class="btn ghost" onclick="go('read','c${n}')">Coach marks</button>${c.from>0?`<br><button class="btn gold" onclick="go('cards','rev')">↺ Review stanzas 1–${c.from}</button>`:''}</div>`;
 }
 h+=`<div class="card"><b>🗺 Training path</b>`;
 pl.chunks.forEach((c,k)=>{const open=chunkOpen(p,pl,k),r=rng(c.from,c.to),m=r.filter(i=>mastered(p,i)).length,now=k===n;
  h+=`<div class="trow ${now?'now':''} ${open?'':'locked'}" style="border-left-color:${COLORS[k%6]}"><div><b>${pl.unit} ${k+1}</b>${now?'<span class="tag">now</span>':''}${m===r.length?' 🌟':''}<div class="muted small">${fmt(c.start)} · stanzas ${c.from+1}–${c.to+1} · ${m}/${r.length} 🌟</div></div><div>${open?`<button class="btn mini red" onclick="go('cards','c${k}')">Cards</button><button class="btn mini" onclick="go('fade','c${k}')">Fade</button><button class="btn mini ghost" onclick="go('read','c${k}')">Cues</button>`:`<button class="btn mini sparkle" onclick="P().unlockedTo=${k};save();go('home',null,true)">✨ Skip ahead</button>`}</div></div>`;});
 h+=`<div class="trow ${n==='polish'?'now':''}" style="border-left-color:#a78bfa"><div><b>Polish</b>${n==='polish'?'<span class="tag">now</span>':''}<div class="muted small">${fmt(pl.polishStart)} → ${fmt(p.date)} · full runs + recording</div></div></div></div>`;
 h+=`<div class="card"><b>✦ Extra practice</b><br>${p.pack&&p.pack.ladder.length?`<button class="btn gold" onclick="go('ladder')">🪜 Story ladder</button>`:''}<button class="btn ghost" onclick="go('read','all')">📜 Full run with cues</button><button class="btn green" onclick="go('record')">🎥 Record myself</button></div>`;
 app.innerHTML=h;
},
gate(next){
 if(!D.pin){
  app.innerHTML=`${back()}<div class="card center"><h2>🔒 Create a grown-up PIN</h2><p class="muted">4 digits. This keeps the settings and API key out of reach.</p><input id="p1" class="pin fld" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="width:200px;margin:8px auto;display:block;font:inherit;border:2px solid var(--line);border-radius:14px;padding:10px"><input id="p2" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="again" style="width:200px;margin:8px auto;display:block;font:inherit;border:2px solid var(--line);border-radius:14px;padding:10px"><button class="btn red" id="go">Save PIN</button><p id="er" class="warn"></p></div>`;
  $('#go').onclick=()=>{const a=$('#p1').value,b=$('#p2').value;if(!/^\d{4}$/.test(a)){$('#er').textContent='Use 4 digits.';return}if(a!==b){$('#er').textContent="The PINs don't match.";return}D.pin=a;save();grownUp=true;go(next||'admin')};
  return;
 }
 app.innerHTML=`${back()}<div class="card center"><h2>🔒 Grown-ups only</h2><input id="p1" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="width:200px;margin:8px auto;display:block;font:inherit;border:2px solid var(--line);border-radius:14px;padding:10px"><button class="btn red" id="go">Enter</button><p id="er" class="warn"></p><p class="muted small">Forgot the PIN? <a href="#" id="fg">Reset it</a> (this also deletes the saved API key).</p></div>`;
 const tryIt=()=>{if($('#p1').value===D.pin){grownUp=true;go(next||'admin')}else{$('#er').textContent='Wrong PIN.';$('#p1').value=''}};
 $('#go').onclick=tryIt;$('#p1').onkeyup=e=>{if(e.key==='Enter'||$('#p1').value.length===4)tryIt()};
 $('#fg').onclick=e=>{e.preventDefault();if(confirm('Reset the PIN and delete the saved API key?')){D.pin='';D.apiKey='';save();go('gate',next)}};
},
admin(){
 const p=P();
 let h=back()+(FLASH?`<div class="card ok">${esc(FLASH)}</div>`:'');FLASH='';
 h+=`<div class="card"><h2>🔒 Grown-ups</h2><button class="btn ghost" onclick="grownUp=false;go('home')">Lock & exit</button></div>`;
 h+=`<div class="card"><b>Pieces</b>${D.pieces.map(x=>`<div class="pv"><div style="flex:1">${esc(x.title)}<div class="muted small">${fmt(x.date)} · ${x.stanzas.length} stanzas</div></div>${x.id===D.cur?'<span class="tag">current</span>':`<button class="btn mini ghost" onclick="D.cur='${x.id}';save();go('admin')">Use</button>`}</div>`).join('')}<button class="btn red" onclick="go('setup','new')">+ New piece</button></div>`;
 if(p){
  const pl=plan(p);
  h+=`<div class="card"><b>This piece</b><label class="fld">Title<input id="t" value="${esc(p.title)}"></label><label class="fld">Author<input id="a" value="${esc(p.author)}"></label><label class="fld">Performance date<input id="d" type="date" value="${p.date}"></label><button class="btn green" id="sv">Save</button><button class="btn ghost" onclick="go('setup','edit')">Edit poem text</button></div>`;
  h+=`<div class="card"><b>Plan</b><div class="muted small">Started ${fmt(p.start)}. ${pl.chunks.length} ${pl.unit.toLowerCase()}s of learning, then ${pl.polish} polish day${pl.polish===1?'':'s'}. Change where each ${pl.unit.toLowerCase()} ends:</div>${pl.chunks.map((c,k)=>`<label class="fld inl">${pl.unit} ${k+1} (${fmt(c.start)}): stanzas ${c.from+1} to <input type="number" class="ce" min="1" max="${p.stanzas.length}" value="${c.to+1}" ${k===pl.chunks.length-1?'disabled':''}></label>`).join('')}<br><button class="btn green" id="svp">Save plan</button><button class="btn ghost" id="ap">Auto-split</button><button class="btn ghost" id="rp">Re-plan from today</button></div>`;
  h+=`<div class="card"><b>Coach marks</b><p class="muted small">${p.pack?'✅ Loaded. Skim them once before she drills.':'None yet.'}</p>${LLAMA_RE.test(p.title)&&p.stanzas.length===24?`<button class="btn gold" id="ll">Load built-in Llama cues</button>`:''}<button class="btn red" id="ask">✨ Ask Claude</button><button class="btn ghost" id="cp">Copy coach request</button><button class="btn ghost" onclick="go('pastepack')">Paste coach pack</button>${p.pack?`<button class="btn ghost" onclick="go('editcues')">Edit cues</button>`:''}<p id="ast" class="muted"></p><textarea id="ptxt" hidden readonly></textarea></div>`;
 }
 h+=`<div class="card"><b>Settings</b><label class="fld">Anthropic API key ${D.apiKey?`<span class="muted small">(saved ••••${esc(D.apiKey.slice(-4))})</span>`:''}<input id="k" type="password" autocomplete="off" placeholder="${D.apiKey?'Leave blank to keep the saved key':'sk-ant-…'}"></label><label class="fld">Model<input id="m" value="${esc(D.model)}"></label><button class="btn green" id="sk">Save settings</button>${D.apiKey?`<button class="btn ghost" id="rk">Remove key</button>`:''}<button class="btn ghost" id="cpin">Change PIN</button></div>`;
 if(p)h+=`<div class="card"><b>Reset</b><br><button class="btn ghost" id="rs">Reset stars & skips</button><button class="btn ghost" id="del">Delete this piece</button></div>`;
 app.innerHTML=h;
 $('#sk').onclick=()=>{const k=$('#k').value.trim();if(k)D.apiKey=k;D.model=$('#m').value.trim()||'claude-sonnet-5-5';save();FLASH='Settings saved.';go('admin')};
 if($('#rk'))$('#rk').onclick=()=>{if(confirm('Remove the saved API key?')){D.apiKey='';save();go('admin')}};
 $('#cpin').onclick=()=>{D.pin='';save();go('gate','admin')};
 if(!p)return;
 $('#sv').onclick=()=>{const t=$('#t').value.trim(),d=$('#d').value;if(!t||!d){alert('Title and date are needed.');return}if(d!==p.date)p.chunkEnds=null;p.title=t;p.author=$('#a').value.trim();p.date=d;save();FLASH='Saved.';go('admin')};
 $('#svp').onclick=()=>{const n=p.stanzas.length,e=$$('.ce').filter(x=>!x.disabled).map(x=>parseInt(x.value)-1).concat([n-1]);if(!validEnds(e,n)){alert('Each end has to be bigger than the one before it, and less than '+n+'.');return}p.chunkEnds=e;save();FLASH='Plan saved.';go('admin')};
 $('#ap').onclick=()=>{p.chunkEnds=null;save();go('admin')};
 $('#rp').onclick=()=>{if(confirm('Restart the schedule from today?')){p.start=todayS();p.chunkEnds=null;p.unlockedTo=0;save();FLASH='Re-planned from today.';go('admin')}};
 if($('#ll'))$('#ll').onclick=()=>{p.pack=JSON.parse(JSON.stringify(LLAMA_PACK));save();FLASH='Llama cues loaded.';go('admin')};
 $('#ask').onclick=async()=>{if(!D.apiKey){$('#ast').textContent='Add your API key in Settings first, or use Copy coach request.';return}if(p.pack&&!confirm('Replace the current coach marks?'))return;const b=$('#ask');b.disabled=true;$('#ast').textContent='✨ Claude is reading the piece… (about 20–40 seconds)';try{await askClaude();FLASH='✨ Coach marks added. Skim them once before she drills.';go('admin')}catch(e){b.disabled=false;$('#ast').innerHTML='<span class="warn">Didn\'t work: '+esc(e.message)+'</span> You can use Copy coach request instead.'}};
 $('#cp').onclick=()=>{const txt=buildPrompt(p),ta=$('#ptxt');const ok=()=>$('#ast').textContent='Copied! Paste it into a chat with Claude, copy the reply, then tap Paste coach pack.';
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(ok).catch(()=>{ta.hidden=false;ta.value=txt;ta.select();$('#ast').textContent='Select all of the text below and copy it.'})};
 $('#rs').onclick=()=>{if(confirm('Reset all stars and skips for this piece?')){p.score={};p.unlockedTo=0;save();FLASH='Stars reset.';go('admin')}};
 $('#del').onclick=()=>{if(confirm('Delete "'+p.title+'" and all its progress?')){D.pieces=D.pieces.filter(x=>x.id!==p.id);D.cur=D.pieces[0]?D.pieces[0].id:null;save();go('admin')}};
},
setup(mode){
 const p=mode==='edit'?P():null,first=!D.pieces.length;
 const v=p||{title:first?'Llama Llama Red Pajama':'',author:first?'Anna Dewdney':'',date:first?'2026-11-30':addD(todayS(),21),raw:'',split:'auto'};
 app.innerHTML=`${back(D.pieces.length?'admin':'home')}<div class="card"><h2>${p?'Edit poem text':'New piece'}</h2>${p?'':`<label class="fld">Title<input id="t" value="${esc(v.title)}"></label><label class="fld">Author<input id="a" value="${esc(v.author)}"></label><label class="fld">Performance date<input id="d" type="date" value="${v.date}"></label>`}<ol class="muted small"><li>Open the poem photo in Photos.</li><li>Press and hold on the words, then Select All, then Copy.</li><li>Paste below. For a second page, paste it underneath.</li></ol><textarea id="raw" placeholder="Paste the poem here…">${esc(v.raw)}</textarea><label class="fld">Stanzas are<select id="sp">${[['auto','Auto-detect'],['blank','Separated by blank lines'],['2','Every 2 lines'],['4','Every 4 lines']].map(([k,l])=>`<option value="${k}" ${v.split===k?'selected':''}>${l}</option>`).join('')}</select></label><button class="btn red" id="split">Split into stanzas</button><div id="prev"></div></div>`;
 const show=()=>{
  const st=parse($('#raw').value,$('#sp').value);
  if(!st.length){$('#prev').innerHTML='<p class="warn">Paste the poem first.</p>';return}
  const changed=p&&st.length!==p.stanzas.length;
  $('#prev').innerHTML=`<p class="ok">Found ${st.length} stanzas. Check that each one looks right.</p>${changed?`<p class="warn">⚠️ That's a different number of stanzas than before (${p.stanzas.length}). Saving will clear the coach marks, stars, and plan edits.</p>`:''}`+st.map((s,i)=>`<div class="pv"><span class="num">${i+1}</span><div>${s.map(esc).join('<br>')}</div></div>`).join('')+`<button class="btn green" id="savep">Save ✦</button>`;
  $('#savep').onclick=()=>{
   const raw=$('#raw').value,split=$('#sp').value;
   if(p){p.raw=raw;p.split=split;if(changed){p.pack=null;p.score={};p.chunkEnds=null;p.unlockedTo=0}p.stanzas=st;save();FLASH='Poem text saved.';go('admin');return}
   const t=$('#t').value.trim(),d=$('#d').value;if(!t||!d){alert('Add a title and a performance date.');return}
   const np={id:'p'+Date.now(),title:t,author:$('#a').value.trim(),date:d,start:todayS(),raw,split,stanzas:st,pack:null,score:{},unlockedTo:0,chunkEnds:null};
   if(LLAMA_RE.test(t)&&st.length===24)np.pack=JSON.parse(JSON.stringify(LLAMA_PACK));
   D.pieces.push(np);D.cur=np.id;save();
   FLASH=np.pack?'Piece added with the built-in Llama coach marks.':'Piece added. Next: tap ✨ Ask Claude to add coach marks.';go('admin');
  };
 };
 $('#split').onclick=show;$('#sp').onchange=()=>{if($('#raw').value.trim())show()};if(v.raw)show();
},
pastepack(){
 app.innerHTML=`${back('admin')}<div class="card"><h2>Paste coach pack</h2><p class="muted small">Paste Claude's whole reply here. Extra words around it are fine.</p><textarea id="pk" placeholder='{"sections": …}'></textarea><button class="btn green" id="ap">Apply</button><p id="er" class="warn"></p></div>`;
 $('#ap').onclick=()=>{try{applyPackText($('#pk').value);FLASH='Coach marks added. Skim them once before she drills.';go('admin')}catch(e){$('#er').textContent="Couldn't read that: "+e.message}};
},
editcues(){
 const p=P();
 let h=back('admin')+`<div class="card"><h2>Edit cues</h2>`;
 p.stanzas.forEach((s,i)=>{const c=p.pack.cues[i]||{v:3,c:''};h+=`<div class="ec"><div><span class="num">${i+1}</span><span class="muted">${esc(s[0])}</span></div><select class="ev">${[1,2,3,4,5].map(v=>`<option value="${v}" ${c.v===v?'selected':''}>${VOLNAME[v]}</option>`).join('')}</select><input class="et" value="${esc(c.c)}"></div>`});
 app.innerHTML=h+`<button class="btn green" id="sv">Save cues</button></div>`;
 $('#sv').onclick=()=>{const ts=$$('.et');p.pack.cues=$$('.ev').map((e,i)=>({v:+e.value,c:ts[i].value.trim()}));save();FLASH='Cues saved.';go('admin')};
},
cards(s){
 const p=P(),idx=sel(s),lab=selLabel(s);let q=shuffle(idx),shown=false,rev=false;
 if(!q.length){go('home');return}
 const draw=()=>{
  if(!q.length){app.innerHTML=`<div class="card center"><div class="huge burst">🌟</div><h2>${lab} round done! ✦</h2>${stars(p,idx)}<button class="btn red" onclick="go('cards','${s}')">Go again</button><button class="btn ghost" onclick="go('home')">Home</button></div>`;return}
  const cur=q[0],L=p.stanzas[cur];let a,b;
  if(L.length===1){a=L[0].split(/\s+/).slice(0,3).join(' ')+' …';b=L[0]}
  else if(rev){a=L[L.length-1];b=L.slice(0,-1).join('\n')}
  else{a=L[0];b=L.slice(1).join('\n')}
  const hid='<p class="line hidden">✦ ✦ ✦</p>';
  app.innerHTML=`${back()}<div class="card center flash" style="border-top:12px solid ${colorOf(p,cur)}">${L.length>1?`<button class="btn ghost toggle" id="rev">${rev?'Mode: end → start':'Mode: start → end'}</button>`:''}<div class="muted">${lab} · Stanza ${cur+1} · ${q.length} left</div>${rev&&!shown?hid:''}${rev&&shown?`<p class="line ans">${br(b)}</p>`:''}<p class="line">${esc(a)}</p>${!rev&&shown?`<p class="line ans">${br(b)}</p>`:''}${shown?`${cueBox(p,cur)}<button class="btn green" id="ok">Got it ✓</button><button class="btn ghost" id="again">Again ↺</button>`:`${rev?'':hid}<p class="muted">Say the ${rev?'part before':'rest'} out loud, then check.</p><button class="btn red" id="show">Show answer</button>`}</div>${stars(p,idx)}`;
  if($('#rev'))$('#rev').onclick=()=>{rev=!rev;shown=false;draw()};
  if(shown){
   $('#ok').onclick=()=>{p.score[cur]=(p.score[cur]||0)+1;save();q.shift();shown=false;draw()};
   $('#again').onclick=()=>{p.score[cur]=Math.max(0,(p.score[cur]||0)-1);save();q.push(q.shift());shown=false;draw()};
  }else $('#show').onclick=()=>{shown=true;draw()};
 };draw();
},
fade(s){
 const p=P(),idx=sel(s),lab=selLabel(s),words=[];
 idx.forEach(i=>p.stanzas[i].forEach((ln,li)=>ln.split(/\s+/).filter(Boolean).forEach(w=>words.push({i,li,w}))));
 const order=shuffle(words.map((_,j)=>j)),MAX=5;let level=0;
 const draw=()=>{
  const hid=new Set(order.slice(0,Math.round(words.length*level/MAX)));
  let html='';
  idx.forEach(i=>{html+=`<div class="stz"><span class="num">${i+1}</span><div>`;
   p.stanzas[i].forEach((_,li)=>{html+='<div>'+words.map((o,j)=>({o,j})).filter(x=>x.o.i===i&&x.o.li===li).map(x=>hid.has(x.j)?`<span class="blank" onclick="this.classList.toggle('peek')">${esc(x.o.w)}</span>`:`<span>${esc(x.o.w)}</span>`).join(' ')+'</div>'});
   html+='</div></div>'});
  app.innerHTML=`${back()}<div class="card"><div style="display:flex;justify-content:space-between"><b>${lab} · Fade-out</b><span class="muted">Level ${level}/${MAX}</span></div><p class="muted">Say it out loud. Then fade more words and say it again. Tap a blank to peek.</p><div class="meter"><div style="width:${level/MAX*100}%"></div></div>${html}${level===MAX?'<p class="center ok burst">🌟 All from memory! Say the whole thing.</p>':''}<div class="center"><button class="btn ghost" id="less" ${level===0?'disabled':''}>Bring back</button><button class="btn red" id="more" ${level===MAX?'disabled':''}>${level===MAX-1?'Hide everything! ✦':'Fade more'}</button></div></div>`;
  $('#less').onclick=()=>{level--;draw()};$('#more').onclick=()=>{level++;draw()};
 };draw();
},
read(s){
 const p=P(),idx=sel(s),all=s==='all';
 let h=back()+`<div class="card"><b>${all?'Full run with coach marks':selLabel(s)+' · Coach marks'}</b>${volMap(p,idx)}</div>`;
 if(all)h+=`<div class="card intro"><div class="muted">Before you start</div>Walk to the center. Stand still. Smile for 2 seconds. Then say:<p class="line sm">${esc(introText(p))}</p>Take one breath, then begin.</div>`;
 idx.forEach(i=>{
  const k=secIdx(p,i);
  if(k>=0){const sc=p.pack.sections[k];if(sc.from===i&&(i>0||!all))h+=`<div class="pausebar">✦ ${esc(sc.name)}${sc.sub?': '+esc(sc.sub):''}${sc.note?`<div style="font-weight:600;margin-top:4px">${esc(sc.note)}</div>`:''}</div>`}
  h+=`<div class="card stzc" style="border-left:12px solid ${colorOf(p,i)}"><span class="num">${i+1}</span><div class="line sm">${p.stanzas[i].map(esc).join('<br>')}</div>${cueBox(p,i)}</div>`});
 if(all)h+=`<div class="card intro">Hold the final pose for 2 seconds. Stand up straight, say "Thank you," bow, and walk off slowly. ✦</div>`;
 app.innerHTML=h;
},
ladder(){
 const L=P().pack.ladder,pool=shuffle(L.map((w,i)=>({w,i})));let next=0,misses=0;
 const draw=()=>{
  app.innerHTML=`${back()}<div class="card"><h2>🪜 Story ladder</h2><p class="muted">What happens first? Tap them in story order.</p><div class="ladder">${L.slice(0,next).map((w,i)=>`<div class="rung">${i+1}. ${esc(w)}</div>`).join('')}</div>${next===L.length?`<p class="ok center burst">🌟 Perfect ladder!${misses?` (${misses} oops)`:''}</p><div class="center"><button class="btn red" onclick="go('ladder')">Shuffle again</button></div>`:`<div class="chips">${pool.filter(x=>x.i>=next).map(x=>`<button class="chip" data-i="${x.i}">${esc(x.w)}</button>`).join('')}</div>`}</div>`;
  $$('.chip').forEach(b=>b.onclick=()=>{if(+b.dataset.i===next){next++;draw()}else{misses++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}});
 };draw();
},
record(){
 app.innerHTML=`${back()}<div class="card"><h2>🎥 Record myself</h2><p class="muted">Do the whole thing, from the intro to the bow. Then watch it together.</p><label class="btn green">Start camera<input type="file" accept="video/*" capture="user" id="cam" hidden></label><video id="vid" playsinline controls hidden></video><div class="check" style="margin-top:14px"><b>Watch-back checklist</b>${CHECK.map(t=>`<label><input type="checkbox"> ${esc(t)}</label>`).join('')}</div><p class="muted small">This app doesn't save the video. It's gone when you leave this screen.</p></div>`;
 $('#cam').onchange=e=>{const f=e.target.files[0];if(!f)return;const v=$('#vid');v.src=URL.createObjectURL(f);v.hidden=false;v.play().catch(()=>{})};
}};
function go(view,arg,keep){
 if(ADMIN.includes(view)&&!grownUp){view==='setup'&&arg==='new'?V.gate('setup-new'):V.gate(view);return}
 if(view==='gate'){V.gate(arg);return}
 if(view==='setup-new'){view='setup';arg='new'}
 if(!keep)window.scrollTo(0,0);
 V[view](arg);
}
for(let i=0;i<10;i++){const p=document.createElement('div');p.className='petal';p.style.left=(Math.random()*100)+'vw';p.style.animationDuration=(9+Math.random()*9)+'s';p.style.animationDelay=(-Math.random()*15)+'s';document.body.appendChild(p)}
go('home');
</script>
</body>
</html>
